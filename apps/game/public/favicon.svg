<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Metin Survivors: a dark obsidian monolith with a glowing orange rune (original drawing) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1410"/>
      <stop offset="1" stop-color="#0b0806"/>
    </linearGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2331"/>
      <stop offset="1" stop-color="#171320"/>
    </linearGradient>
    <linearGradient id="face-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3243"/>
      <stop offset="1" stop-color="#1d1827"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb04a" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#ff7a1a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <!-- ember glow pooling at the foot of the stone -->
  <ellipse cx="32" cy="56" rx="24" ry="6" fill="url(#ground)"/>
  <!-- the monolith: two obsidian faces meeting at a ridge, cut off at a slant on top -->
  <path d="M17 57 L19.5 22 L32 6 L32 57 Z" fill="url(#face-l)"/>
  <path d="M32 6 L45 20 L47 57 L32 57 Z" fill="url(#face-r)"/>
  <!-- chipped, polished edges -->
  <path d="M19.5 22 L32 6 L45 20" fill="none" stroke="#6c5f7a" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M32 6 L32 57" fill="none" stroke="#51465e" stroke-width=".9"/>
  <path d="M17 57 L19.5 22 M47 57 L45 20" fill="none" stroke="#3b3346" stroke-width="1" stroke-linecap="round"/>
  <!-- rune glow -->
  <circle cx="32" cy="35" r="13" fill="url(#halo)"/>
  <!-- the rune: a barbed thorn glyph, burned into the stone -->
  <path d="M31 24 V47 M31 28 L40 34.5 L31 41" fill="none" stroke="#ff8a2a" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" opacity=".5"/>
  <path d="M31 24 V47 M31 28 L40 34.5 L31 41" fill="none" stroke="#ffd29a" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
