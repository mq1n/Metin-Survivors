    <style>
      /* The first paint: the boot screen's dock in plain CSS + two tiny inline rasters (blurred key art, the gauge frame) and a CSS liquid,
         so a cold start is never a blank page. It sits above #game and below #ui: the boot screen fades in over it, and
         /boot-splash.js drives the gauge (window.__msSplash). No inline script: the CSP forbids it. */
      @font-face {
        font-family: 'Cinzel';
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url('/fonts/cinzel-vf-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Alegreya Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/alegreya-sans-400-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      #boot-splash {
        /* the UI's rem (ui/layout.ts computeRem) before the UI exists, so the splash and the boot screen share one scale */
        --r: min(clamp(13px, calc(11.3px + 0.435vh), 16px), calc(100vw / 55));
        --bh: 2.6;
        --k: calc(var(--r) * var(--bh) / 137);
        --gy: 85.5%;
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #0b0806;
        color: #e3d6b4;
        font-family: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
        pointer-events: none;
      }
      @media (min-height: 1080px) {
        #boot-splash {
          --r: calc(100vh / 67.5);
        }
      }
      @media (orientation: portrait) {
        #boot-splash {
          --r: clamp(9px, calc(100vw / 26), 22px);
          --bh: 2.4;
        }
      }
      #boot-splash .bs-bed {
        position: absolute;
        inset: -6%;
        background: url('data:image/webp;base64,UklGRhoDAABXRUJQVlA4IA4DAABwDgCdASpAACQAPrFGnEmnI6KhMrtoAOAWCWwAuzNyB1ihPa7e/ncmamZPQmxtBw/kLpM6Whnz0A1MP7ywbn5dwp2E4yX2lVRtZyhKuynLsX7ccCRDgmrAyut4cGvsnlgqLKHAn/N5FGX3RIm7itDuvf15zCnZlHJGtNhMAP7+uHSjGSGy4q2oBe4pn0gEY8HZDrnxu0GOjVsMYQIXCyoV6tvU41Wu5xRnQadhLrunsv4iFAxno7hfAh5mh+IwhVbi07shUmTbKfXKqDouiZ4LND+ViGzMY9Bja8Dode4oX8P6SdpqII5vuaTxrDD7hsrj9n8mV/vKAttGKcABi1Pf/ZpfLI7d/NCK8r+sMaVb+WUIbmqDkwWMsIHb0q83QJKgX4/SRYHr/4eRNiuUoBzunP8kBwMkiTqllMO5McTqVBP79BXJL1HR1TjaxDS0CpU4viaFcR8iwZYGuUNVJqs7X0w4BgNl8s6XeO3cPDaGsfyjKIeYgj5h/dknUjvJUV5an+lPqJXechFURD5wR9wzbHdurcOo///4Hb16MUhnIqk92lNK7hjR6k4Obdq3Us4ck3yS7KvkqhOK/3LkrrbQWSQyfJetHFx9StoxBamCB5U19p0SgZTQnd9LQK0WsI1GuXIbUUM2cKhrY2Y0BYsvn9fgtxzsEAI7zKRpdZSagkAn5w3Xjx6GGFjTZ4cqel5pv02fHhkENTKZOw/QZeYUyUL6aJkHWTYaqxUHgyu4xe3+kUhFGjjJTQqAI7d8cqvbPmqiSuecPkCL0ifthK9VFC7dWkCpwShlrqlsnDdbQZvRswI9YPnDoRiQjyK7q/1NJR0i16cvO/KzKT+Qbw5suj7VIlZq6MZbVOFDsGOoDYC45EbL32tyWxd7NYOwAY6VJ0jTQBj9o4dtk9SpcX7Y0inTCzq1tw8xIP2ze7JqrH+bRClzuSD3JFJwB7gTG217mpa9gPRAC9PRUE1eNiDovH43vA4035ebFlDeHONPkEIwgfGMfjnUKtk8MzpBXlLIfQgCtq2vPuZ0azwAAA==') center / cover no-repeat;

      #boot-splash .bs-shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(0deg, rgba(6, 4, 3, 0.97) 0, rgba(6, 4, 3, 0.9) 15%, rgba(6, 4, 3, 0.55) 34%, rgba(6, 4, 3, 0.1) 52%, transparent 64%),
          radial-gradient(60% 46% at 50% 36%, rgba(8, 4, 3, 0.45), transparent 75%),
          radial-gradient(125% 105% at 50% 42%, transparent 54%, rgba(4, 2, 2, 0.74) 100%);
      }
      /* the lock-up sits where the boot screen puts it (top left, calm corner of the key art), so the logo never jumps when the screen takes over */
      #boot-splash .bs-top {
        position: absolute;
        top: 4.5%;
        left: 4.5%;
        width: min(calc(24 * var(--r)), 32%);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #boot-splash .bs-logo {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 0 1.1rem rgba(255, 140, 40, 0.5)) drop-shadow(0 0.35rem 0.6rem rgba(0, 0, 0, 0.8));
      }
      #boot-splash .bs-sub {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(0.8 * var(--r));
        width: 100%;
        margin-top: calc(0.4 * var(--r));
        font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif;
        font-weight: 800;
        font-size: max(calc(0.94 * var(--r)), 13px);
        letter-spacing: 0.34em;
        white-space: nowrap;
        text-transform: uppercase;
        color: #f9e6ae;
        text-shadow: 0 0.08rem 0.1rem #000, 0 0 0.45rem #000, 0 0 1rem rgba(0, 0, 0, 0.95);
      }
      #boot-splash .bs-sub::before,
      #boot-splash .bs-sub::after {
        content: '';
        flex: 1 1 0;
        min-width: calc(0.8 * var(--r));
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(236, 200, 112, 0.85));
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.8);
      }
      #boot-splash .bs-sub::after {
        background: linear-gradient(270deg, transparent, rgba(236, 200, 112, 0.85));
      }
      #boot-splash .bs-gauge {
        position: absolute;
        left: 50%;
        translate: -50% 0;
        bottom: calc(100% - var(--gy) - 68.5 * var(--k));
        width: min(calc(50 * var(--r)), calc(100% - 2 * var(--r)));
      }
      #boot-splash .bs-cap {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: var(--r);
        height: calc(1.8 * var(--r));
        padding: 0 calc(118 * var(--k));
      }
      #boot-splash .bs-stage {
        font-size: max(calc(1.125 * var(--r)), 15px);
        letter-spacing: 0.05em;
        color: #e3d6b4;
        text-shadow: 0 0.08rem 0.3rem #000, 0 0 0.8rem #000;
      }
      #boot-splash .bs-pct {
        font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif;
        font-weight: 800;
        font-size: max(calc(1.125 * var(--r)), 15px);
        letter-spacing: 0.04em;
        font-variant-numeric: lining-nums tabular-nums;
        color: #dff0ff;
        text-shadow: 0 0.1rem 0 #0b2a5c, 0 0 0.9rem rgba(80, 160, 255, 0.6), 0 0.1rem 0.4rem #000;
      }

      /* the glass tube window of the frame (x 118..W-118, y 40..94 in frame units); border-box offsets are relative to the padding box */
      #boot-splash .bs-ch {
        position: absolute;
        left: calc(-32 * var(--k));
        right: calc(-32 * var(--k));
        top: calc(40 * var(--k));
        height: calc(54 * var(--k));
        overflow: hidden;
        container-type: inline-size;
        border-radius: calc(27 * var(--k));
      }
      #boot-splash .bs-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 3%;
        border-radius: calc(27 * var(--k)) 0 0 calc(27 * var(--k));
        background:
          linear-gradient(180deg, rgba(226, 244, 255, 0) 0, rgba(226, 244, 255, 0) 9%, rgba(226, 244, 255, 0.8) 17%, rgba(226, 244, 255, 0.28) 29%, rgba(226, 244, 255, 0) 42%),
          linear-gradient(90deg, rgba(2, 12, 36, 0.38), rgba(2, 12, 36, 0) 16%, rgba(2, 12, 36, 0) 84%, rgba(120, 190, 255, 0.3)),
          linear-gradient(180deg, #08224f 0, #1a5ec6 20%, #3c8cf0 36%, #1a58bd 58%, #0e3a8c 80%, #164aa8 91%, #061a44 100%);
        box-shadow: inset 0 -1px 0 rgba(120, 190, 255, 0.45), inset 0 1px 0 rgba(0, 0, 0, 0.55);
        transition: width 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
        animation: bs-creep 16s cubic-bezier(0.1, 0.7, 0.2, 1) forwards;
      }
      #boot-splash .bs-fill::after {
        content: '';
        position: absolute;
        top: -9%;
        right: 0;
        bottom: -9%;
        width: max(2px, calc(3 * var(--k)));
        background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(235, 248, 255, 0.98) 22%, rgba(235, 248, 255, 0.92) 78%, rgba(255, 255, 255, 0));
        box-shadow: 0 0 0.45rem 1px #4aa6ff;
      }
      @keyframes bs-creep {
        to {
          width: 33%;
        }
      }
      /* still nothing after 22 s: say so, and offer a reload (pointer-events on, the only live part of the splash) */
      #boot-splash .bs-slow {
        position: absolute;
        left: 50%;
        translate: -50% 0;
        top: calc(var(--gy) + 68.5 * var(--k) + 1 * var(--r));
        width: min(calc(46 * var(--r)), calc(100% - 2 * var(--r)));
        margin: 0;
        text-align: center;
        font-size: max(calc(1.05 * var(--r)), 14px);
        line-height: 1.4;
        color: #cdbf9d;
        text-shadow: 0 0.08rem 0.3rem #000;
        opacity: 0;
        visibility: hidden;
        animation: bs-slow-in 0.8s 22s forwards;
      }
      #boot-splash .bs-slow a {
        pointer-events: auto;
        display: inline-block;
        margin-left: 0.6em;
        padding: 0.3em 0.9em;
        color: #1c1308;
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 800;
        letter-spacing: 0.08em;
