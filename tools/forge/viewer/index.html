<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222; font: 12px/1.3 system-ui, sans-serif; color: #eee; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ui { position: fixed; top: 8px; left: 8px; display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: rgba(15,15,20,.72); border-radius: 6px; backdrop-filter: blur(4px); }
  #ui select, #ui input { font: inherit; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="/viewer.js"></script>
</body>
</html>
